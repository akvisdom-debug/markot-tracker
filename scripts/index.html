<style>
:root{--bg:#060814;--card:rgba(12,16,36,.62);--line:rgba(160,180,255,.12);--txt:#e8ecff;--mut:#8d96bd;--accent:#2effa0;--accent2:#a48bff;--cyan:#3fd6ff;--warn:#ffc56b;

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
radial-gradient(900px 500px at 10% -10%,rgba(46,255,160,.13),transparent 60%),

a{color:var(--cyan)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr) 400px;gap:18px;padding:18px;max-width:1600px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* sidebar */
.side{padding:16px;align-self:start;position:sticky;top:18px}
.brand{font:800 19px var(--display);letter-spacing:-.01em;background:var(--aur);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 14px}
.lab{font:600 11px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.sitem{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--txt);border-radius:11px;padding:9px 10px;cursor:pointer;font:inherit;margin-bottom:4px}
.sitem:hover{background:rgba(255,255,255,.04)}
.sitem.on{background:rgba(46,255,160,.08);border-color:rgba(46,255,160,.35)}

.write{margin-top:10px;width:100%;border:0;border-radius:11px;padding:11px;font:700 14px var(--display);cursor:pointer;color:#04120b;background:var(--aur)}
.write.on{outline:2px solid #fff3}
.back{display:inline-block;margin-top:16px;font-size:12.5px;color:var(--mut);text-decoration:none}.back:hover{color:var(--txt)}
/* main */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.head{padding:20px 22px}
.head h1{margin:0;font:800 30px/1.1 var(--display);letter-spacing:-.02em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.g{color:var(--accent);border-color:rgba(46,255,160,.35)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.st{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

.body{padding:20px 22px}
.script{font-size:16.5px;line-height:1.7;max-width:70ch}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

textarea{width:100%;min-height:520px;resize:vertical;background:rgba(0,0,0,.28);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:16px;font:16px/1.7 Inter,sans-serif}

.saved{font-size:12px;color:var(--mut);margin-left:auto;align-self:center}
.tip{font-size:13px;color:var(--mut);margin:0 0 12px}

.refs{padding:16px;align-self:start;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}

.rtop{display:flex;gap:11px;padding:10px}
.thumb{width:72px;height:110px;flex:none;border-radius:9px;background:#111 center/cover;position:relative;display:block}
.thumb:after{content:"▶";position:absolute;inset:auto 6px 6px auto;font-size:11px;background:#000a;border-radius:6px;padding:2px 6px;color:#fff}
.rt{min-width:0}.rt b{display:block;font:700 14px/1.3 var(--display)}
.ch{font-size:12px;font-weight:600}
.nums{font-size:12px;color:var(--mut);margin-top:3px}.nums .x{color:var(--accent);font-weight:700}
.took{padding:0 10px 10px;font-size:13.5px}.took:before{content:"Taken from it: ";color:var(--accent2);font-weight:600}
.op{margin:0 10px 10px;font-size:13px;color:var(--mut);border-left:2px solid var(--accent2);padding-left:9px;font-style:italic}
details{border-top:1px solid var(--line)}summary{cursor:pointer;padding:8px 10px;font-size:12.5px;color:var(--cyan)}
.tr{padding:0 10px 10px;font-size:13px;max-height:280px;overflow:auto}
.tr div{display:flex;gap:8px;margin:3px 0}.tr i{color:var(--mut);font-style:normal;font-variant-numeric:tabular-nums;min-width:34px}
.tr .k{color:var(--accent2);font-size:11px;text-transform:uppercase;min-width:52px}
@media(max-width:1200px){.app{grid-template-columns:220px minmax(0,1fr)}.refs{grid-column:1/-1;position:static;max-height:none}}
@media(max-width:760px){.app{grid-template-columns:1fr;padding:12px 16px}.side{position:static}.stats{grid-template-columns:repeat(2,1fr)}.head h1{font-size:24px}}

 zombies took over the city, and the only way to scavenge safely is the map.", "wps": 3.31, "lines": [[0.0, "In this world, zombies took over the city, and the only way to scavenge safely is"], [4.4, "the map."], [5.0, "You see, it's a giant hand-drawn map that covers a whole wall of our bunker."], [9.3, "Every street, every store, every nest."], [12.0, "Red Xs mean zombies."], [13.8, "Blue circles mean food."], [15.2, "There's a dinosaur doodle in the corner that nobody ever erased, and there's only one rule."], [19.6, "Never go down a street that isn't on the map."], [22.0, "Nobody who did ever came back."], [24.1, "Pine Street has been erased and redrawn five times."], [27.1, "My name is Sense."], [28.1, "I'm 12."], [28.9, "I'm the fastest runner in the bunker, but I can't read a map."], [31.8, "I get lost going to the bathroom."], [33.4, "My best friend Felix draws the map."], [35.4, "He drew the dinosaur, too, when he was seven."], [37.7, "If you ever get lost, Sense, just run toward the sun."], [40.6, "Our bunker is west."], [41.9, "The sun always sets right on it."], [43.8, "One afternoon, six of us went out for medicine, left on Oak, right on Pine."], [48.1, "Pine Street was quiet, too quiet, breathing from every window."], [52.1, "Felix looked at the map, then at the street sign."], [54.7, "I swapped them, he whispered."], [56.4, "Pine and Birch."], [57.5, "I drew them backwards."], [58.8, "That's why he kept redrawing it."], [60.6, "We were standing in the middle of a nest."], [62.4, "A door creaked open, then another."], [64.4, "40 zombies stepped out into the street."], [66.7, "Sunset was in and without the map, nobody knew the way home."], [70.6, "You know the way, Felix said."], [72.4, "I can't read maps."], [73.6, "You don't need to."], [74.6, "Run toward the sun."], [75.7, "Then he climbed the old billboard on the corner."], [77.8, "He pulled a cooking pot out of his bag and banged it."], [80.5, "Clang, clang, clang."], [82.7, "Over here."], [83.5, " . They ride the branches.\nRobots cut down trees to build more city. The forest grows vines to pull the robots apart.\nAnd there's only one rule. Metal and wood never mix.\n\nMy name is Leo. My mom grows trees. My dad is a robot.\nThey met under the oldest tree in the world, right between the two kingdoms. So both kingdoms kicked us out.\nNow we live in a little house under that tree.\n\nMy power? Any metal I touch grows a flower.\nDad's arm? Daisy. The toaster? Daisies. My bike? Also daisies.\nRobot kids call me Daisy. Forest kids call me Rust Boy.\nOnly Dad never laughs. He just taps the flower on his arm and says, \"Flowers always find a crack.\"\n\nThen the robots built something to end the war for good.\nA giant machine, taller than a mountain, with saws for hands.\nIt walked into the forest. Every step, a hundred trees fell.\nThe forest wrapped it in vines. They snapped like string.\nThen it turned around and stomped into Robot City too. The robots pressed STOP. Nothing happened. It was built to never stop.\nAnd now it was walking straight toward the oldest tree. Our tree.\n\nI ran at it and slapped its foot. One tiny daisy. It stepped right over me.\nThen I saw Mom and Dad, standing in front of our tree, holding hands. Metal and wood.\nThey mixed. And they made me.\nFlowers always find a crack. And that machine was nothing but cracks.\n\nI jumped on its leg and grabbed on with both hands.\nFlowers burst out of every bolt, every gear, every joint.\nOne gear stopped. Then ten. Then all of them.\nThe machine creaked, groaned, and froze, with its saw touching one single leaf of our tree.\n\nNow the war machine is the biggest garden in the world.\nRobot kids climb it. Forest kids water it.\nEveryone still calls me Daisy. But now they line up for flowers on their bikes.", "refs": [{"id": "XgHrK-zRj2k", "took": "The whole frame: two kingdoms at war for 300 years, \"You see\" jokes about each side's kids, the one rule \"never mix\", a mom from one side and a dad from : 10183753, "duration": 129, "date": 1794864086, "x": 5.2, "open": "My mom bends lightning.", "wps": 4.13, "lines": [[0.0, "My mom bends lightning."], [1.2, "My dad bends sand."], [2.4, "Their kingdoms have been at war for 300 years."], [4.7, "There is one rule."], [5.5, "Lightning never meets sand."], [7.1, "They met, and I got the worst power in the world."], [9.3, "Nobody knows what it's for."], [10.4, "Spark kids toast bread by pointing at it."], [12.3, "Their hair never lies down."], [13.8, "Dune kids build their own slides at recess."], [15.7, "Nobody has ever found one in hide and seek."], [17.5, "And right on the border stands the storm, a wall of sand full of lightning as"], [21.0, "tall as the cliffs."], [21.9, "Every year it grows a little taller."], [23.5, "That's your sand, says the Spark king."], [25.8, "That's your lightning, says the Dune queen."], [27.8, "We live in the only house on the border."], [29.6, "Mom met dad when her lightning hit his dune."], [31.6, "It left one glass footprint."], [33.0, "It's our front step."], [33.8, "I wave my hand and a marble goes plink, then it rolls off the table and"], [36.8, "breaks."], [37.2, "Kids on both sides call me marble."], [38.8, "I spend most of recess sweeping."], [40.1, "Dad always says sand forgets every shape."], [42.3, "Lightning never has one."], [43.2, "Together something finally stays."], [44.9, "I thought stays meant stays on the floor in pieces."], [47.6, "Then came year 300 and the biggest battle of all."], [50.5, "Both armies lined up with the storm between them."], [52.7, "Crack!"], [53.1, "Lightning bolts as wide as rivers."], [54.8, "Whump!"], [55.2, "Waves of sand as tall as towers."], [57.1, "Every bolt that missed went into the storm."], [59.1, "So did every wave."], [60.1, "And the storm took one step."], [61.5, "It ate our mailbox, then our fence."], [63.3, "The Spark army threw lightning at it."], [64.9, "The storm drank it and got brighter."], [66.5, "The Dune army threw sand at it."], [68.0, "The storm picked it up and wore it."], [69.4, "That's when I saw it."], [70.2, "For 300 years every bolt and every wave that missed had landed in the same place."], [74.6, "It was never weather."], [75.4, "It was 300 years of misses standing in one spot."], [78.6, "Everybody ran."], [79.5, "I ran the other way."], [80.3, "Mom screamed my name."], [81.7, "Sand forgets every shape."], [83.0, "Lightning never has one."], [84.1, "I slammed my hands onto our front step and I pulled."], [86.7, "Plink!"], [87.1, "One marble."], [87.7, "It rolled into the storm and was gone."], [89.6, "So I stopped trying to make glass."], [91.1, "The storm was sand and lightning."], [92.8, "That's not a monster."], [93.7, "That's ingredients."], [94.6, "I pulled on the storm."], [96.5, "It went quiet from the bottom up."], [97.8, "A wave of glass taller than the cliffs frozen right over our roof."], [101.1, "The lightning was still inside it shining."], [102.9, "Something finally stayed."], [104.3, "So that's what it's for."], [105.4, "Nobody moved."], [106.2, "Then a Spark kid walked up and pressed her face against the glass."], [109.0, "On the other side a Dune kid did the same."], [110.8, "For the first time in 300 years they could see each other."], [113.5, "It turns out everybody looks the same squished against a window."], [115.9, "We cut a door in it, then another."], [117.3, "Now it's a market with a glass roof."], [118.8, "And at night it both kingdoms."], [120.5, "Kids on both sides trade marbles now."], [122.3, "The cracked ones are worth the most."], [123.6, "For 300 years they blamed each other for the storm."], [126.1, "Now they both take credit for me."]], "beats": [{"t": 0, "k": "hook", "s": "Lightning mom and sand dad make a kid with the worst power"}, {"t": 9.3, "k": "setup", "s": "Kids call him marble; border storm grows every year"}, {"t": 47.6, "k": "turn", "s": "Year 300 battle feeds the storm; it eats the house"}, {"t": 69.4, "k": "twist", "s": "The storm is 300 years of missed attacks piled up"}, {"t": 84.1, "k": "climax", "s": "He pulls the storm into glass and freezes it"}, {"t": 104.3, "k": "end", "s": "Glass wall becomes a market; both kingdoms trade marbles"}]}, {"id": "WKVdYOh0Xls", "took": "Leo gets the weakest, most laughed-at power and a mean nickname, then that exact power saves everyone.", "channel": "SensBloxx", "title": "The Stone Gives You Animal Powers ✨", "views": 20735318, "duration": 106, "date": 1793022706, "x": 3.1, "open": "In this world, on your first day of school, you get one animal power.", "wps": 3.74, "lines": [[0.0, "In this world, on your first day of school, you get one animal power."], [3.8, "You see, you put your hand on the old stone by the school gate and it"], [6.9, "chooses for you."], [7.7, "Whatever it gives you, you keep forever."], [9.7, "So, cheetah kids win every race, owl kids do their homework at 3:00 a.m., and eagle"], [14.4, "kids never lose a ball on the roof."], [16.3, "The stone gave me snail."], [17.9, "I'm slow."], [18.6, "I leave a sticky trail on the hallway floor, and when I'm scared, I curl up"], [22.2, "inside my hoodie."], [23.1, "But, snail can do one thing."], [24.5, "I stick to anything."], [25.8, "Walls, ceilings, the bottom of the slide."], [28.3, "And when it's wet, I stick even harder."], [30.1, "Then, there's Rex."], [31.4, "Rex got bull."], [32.4, "He's the strongest kid in school."], [34.0, "He carries me around like a backpack."], [35.7, "He sticks me to the lunchroom window so everyone can see, and he calls me slime."], [39.6, "Now, everyone calls me slime."], [41.2, "Until our class trip to Cliffside Park."], [43.4, "Halfway up the trail, the sky went black and it started to pour."], [46.5, "Everyone ran for the bus, except Rex."], [48.8, "\"Bulls don't run from rain!\" he yelled, and he stomped out onto the lookout rock."], [52.7, "Crack!"], [53.2, "The rock broke."], [54.2, "Rex slid straight down the cliff and grabbed a tiny ledge, 50 ft down, right over"], [58.5, "the river."], [59.0, "An eagle girl jumped to fly down to him."], [61.0, "The wind threw her back."], [62.2, "A cheetah kid tried climbing down."], [63.8, "He slipped on the wet rock."], [65.1, "The teacher's rope was too short."], [66.5, "The cliff was soaking wet, too slippery for anyone, anyone except me."], [70.4, "I looked at the rain."], [71.4, "I looked at Rex, and I went over the edge."], [73.5, "Hands stuck, knees stuck, 1 in at a time."], [76.5, "The wind pulled at my hoodie, but I didn't move."], [78.8, "\"Slime, hurry!\" \"I can't hurry."], [81.0, "I'm a snail.\" His fingers slipped."], [82.8, "I grabbed his wrist."], [83.9, "Then, I did the thing snails do best."], [85.6, "I held on."], [86.6, "\"Climb me,\" I said, and Rex did the thing bulls do best."], [89.8, "He pulled himself up, over my back, all the way to the top."], [93.0, "Then, he reached down with one arm and lifted me up like I weighed nothing."], [96.3, "The whole class was standing in the rain, staring."], [99.0, "Nobody called me slime again."], [100.8, "And now, every time it rains, Rex walks me to school, slowly."]], "beats": [{"t": 0, "k": "hook", "s": "On your first school day a stone gives you an animal power"}, {"t": 10, "k": "rule", "s": "Cheetah wins races, owl studies at night, forever"}, {"t": 16, "k": "setup", "s": "Leo gets snail, slow but sticky; bully Rex has bull"}, {"t": 41, "k": "turn", "s": "Class trip rain; Rex breaks the lookout rock and hangs off a"}, {"t": 59, "k": "turn", "s": "Eagle, cheetah, and the rope fail on the wet cliff"}, {"t": 70, "k": "climax", "s": "Leo climbs down on his sticky hands and holds Rex's wrist"}, {"t": 87, "k": "end", "s": "Rex climbs him and carries him up; nobody calls him slime"}]}, {"id": "YC7kiScw35Q", "took": "The danger becomes something the whole town loves, and the ending is a new ritual (kids line up for flowers).", "channel": "SensBloxx", "title": "The Ocean Pulls Back 🌊", "views": 28209313, "duration": 136, "date": 1794319066, "x": 4.2, "open": "In this world, once every 100 years, the ocean pulls back for one whole day, and you can walk on", "wps": 3.18, "lines": [[0.0, "In this world, once every 100 years, the ocean pulls back for one whole day, and"], [5.4, "you can walk on the bottom of the sea."], [7.2, "You see, the night before, the whole town builds ladders down the cliffs."], [10.9, "At sunrise, the water just leaves, miles of it."], [14.1, "People walk between shipwrecks, kids climb coral cliffs taller than houses."], [18.2, "Mr."], [18.5, "Finch found a treasure chest."], [20.0, "It was full of sand."], [21.2, "He's still happy about it, and there's only one rule."], [23.9, "Be back on shore before sunset."], [25.8, "That's when the sea comes home."], [27.4, "But here's the weird part."], [28.6, "This morning, every seagull in town flew inland."], [31.3, "Not one stayed on the beach."], [33.0, "My name is Sens."], [34.1, "I collect shells, hundreds of them."], [36.0, "Hold one to your ear, and it hums its own little song."], [38.9, "I know every one."], [40.0, "Kids say it's the most boring hobby on earth."], [42.2, "Grandpa gave me his old conch, passed down since the last low tide."], [45.9, "When the sea's coming home, he said, the shells start to sing."], [49.5, "At sunrise, the sea pulled back."], [51.6, "The whole town climbed down."], [53.3, "Glowing coral, giant whale bones, a sunken pirate ship lying on its side."], [58.0, "I walked 3 miles out, farther than anyone."], [60.8, "Noon, I picked up a shell."], [62.4, "It was singing."], [63.2, "Then another and another."], [64.7, "Every shell on the sea floor singing at once."], [67.2, "Hours early, I looked at the horizon."], [69.4, "It was rising."], [70.3, "The sea didn't leave for the day."], [71.9, "It pulled back to take a breath for the biggest wave in 100 years, and the"], [76.2, "whole town was miles out on the seabed."], [78.5, "I screamed."], [79.4, "Nobody heard me."], [80.4, "Then I remembered Grandpa's conch."], [82.1, "I climbed the mast of the pirate ship, took the deepest breath of my life, and blew."], [88.3, "It rolled across the sea floor like thunder."], [90.6, "Everyone turned."], [91.6, "They saw the wave, and they ran."], [93.7, "Families sprinting between shipwrecks, dads carrying kids on their shoulders, grandmas climbing ladders faster than I've"], [99.6, "ever seen."], [100.5, "The wave was a wall now, taller than the cliffs, dark green with sunlight shining through it."], [105.6, "I slid down the mast and ran 3 miles."], [108.5, "I hit the bottom of the ladder and climbed."], [110.6, "Behind me, the roar got louder."], [112.7, "A hand grabbed my wrist and pulled me over the top."], [115.1, "Mom, the wave slammed into the cliffs below us."], [118.0, "Boom!"], [118.9, "Spray shot 100 feet into the and fell like rain over the whole town."], [123.2, "I looked around."], [124.1, "Every family, every kid, every grandma, everyone made it."], [128.0, "Now grandpa's conk hangs in the town hall, and 100 years from now at noon someone"], [133.2, "will blow it just in case."]], "beats": [{"t": 0, "k": "hook", "s": "Every hundred years the ocean pulls back for one day"}, {"t": 21, "k": "rule", "s": "One rule: be back on shore before sunset"}, {"t": 27, "k": "turn", "s": "Seagulls fly inland; Sens collects shells and has grandpa's conch"}, {"t": 50, "k": "setup", "s": "The town walks the seabed; Sens goes three miles out"}, {"t": 61, "k": "twist", "s": "All shells sing; the sea is gathering for a huge wave"}, {"t": 80, "k": "climax", "s": "Sens blows the conch from a ship mast"}, {"t": 115, "k": "end", "s": "Wave hits the cliffs; everyone survives; conch hangs in town hall"}]}], "why": ["The power is easy to see and funny straight away: a daisy pops out of Dad's arm, the toaster, the bike. Mud (Water And Fire) and marbles (Lightning and Sand) are less pretty and harder to show.", "One threat for both sides. The machine attacks the forest and then Robot City too, so the war has to stop, not just one side winning.", "The planted line pays off as a picture: \"Flowers always find a crack\" plus a machine that is nothing but cracks. Kids get it without anyone explaining.", "Mom and Dad holding hands in front of the tree is the emotional beat: \"They mixed. And they made me.\" The rivals keep the parents in the background.", "Close call ending: the saw stops on one leaf of their tree. Clear stakes, happy ending.", "Warm last line: the mean nickname stays, but now it's a good thing (they line up for flowers)."], "watch": "Very close to SensBloxx's Water And Fire Don't Mix (4.2× their usual): the first 20 seconds are almost line for line (\"two kingdoms… war for 300 years… You see… only one rule… never mix… my mom is… my dad is…\"), and Volze's Lightning And Sand has the same setup. Consider a different opening line so it doesn't look copied."}, {"slug": "size-is-bravery", "title": "Your Size Is How Brave You Are", "version": "v5", "date": "2026-11-23", "formula": "Weak power + bully", "nickname": "Shoe", "status": "Ready for review", "script": "In this world, the braver you are, the bigger you grow. And I'm the size of a shoe.\n\nYou see, our firefighter is taller than the fire station. She doesn't put out fires. She steps on them.\nBabies are the biggest people in town, because babies aren't scared of anything.\nAnd my dog, Biscuit, is smaller than a teacup. Because of the vacuum cleaner.\n\nI'm Leo, and I'm scared of everything. Spiders. Thunder. That one goose by the pond.\nEvery birthday, Mom marks my height on the doorframe. Six marks, all in the same spot. \"Some kids grow late,\" she says.\nThen there's Brock. He's as tall as a lamppost, and every morning he picks me up with two fingers and says, \"Morning, Shoe.\"\nBut last week, a spider fell into our teacher's coffee. Brock screamed so loud he shrank to the size of a fridge.\nI was shaking too, but I carried that spider outside anyway. I'm scared every day. I just do the thing anyway.\n\nThen, on Tuesday, the ground shook. Boom. Boom.\nA giant green foot stepped out of the sea.\nSo what walks out of the sea on a Tuesday?\n\nEveryone panicked, and the whole town shrank. Our firefighter shrank to the size of a bike.\nBrock shrank fastest of all. Lamppost. Fridge. Shoe.\nOnly the babies stayed giant, giggling and waving at the foot.\nThen it took a step. Crash. The water tower went down.\nAnd it was walking straight down Main Street, where everyone was tiny now.\n\nSo I took one step toward it, and I grew. One step, a chair. Two steps, a house.\nThen it roared, and I shrank right back to a shoe.\nA tiny voice said, \"Leo… what do we do?\" It was Brock. Smaller than me.\nI was scared. So I did the thing anyway.\nOne step, a house. Two steps, the clock tower. Three steps, and I was looking it right in the eye.\n\nBig, curious eyes, just like the babies.\nIt wasn't a monster. It was a baby turtle. And that roar was just a yawn. It was lost, looking for its mom.\nSo I picked it up and carried it back to the sea. Step. Step. Splash.\nIts mom rose out of the waves and nodded at me. I think that's turtle for thank you.\n\nThat night, Mom looked at the doorframe, then got a very tall ladder. My new mark is on the roof.\nBrock says \"Morning, Leo\" now. He has to look up to say it.\nAnd every Tuesday, a baby turtle comes to visit. Biscuit is not happy about it.", "refs": [{"id": "a9F3W62BZF8", "took": "A world rule that is about the hero himself, with irony: the smallest kid is the most scared one.", "channel": "Gneef", "title": "Your Superpower Is Your Opposite ⚡", "views": 22138197, "duration": 138, "date": 1792869317, "x": 4.1, "open": "In my world, everyone gets a superpower at 13, and it's always the opposite of who you are.", "wps": 4.46, "lines": [[0.0, "In my world, everyone gets a superpower at 13, and it's always the opposite of who"], [3.9, "you are."], [4.2, "You see, the shyest girl in my school got a voice like thunder."], [7.1, "When she whispers, windows break."], [8.6, "The meanest bully in town got healing hands."], [10.7, "Now he has to fix every scraped knee on the playground."], [12.9, "The biggest liar in our grade, he can only tell the truth forever."], [15.6, "He's miserable."], [16.5, "And the most scared man in the whole city got invincible skin."], [19.4, "He's still too scared to use it."], [20.6, "On your 13th birthday, you go to testing day at the hero guild."], [23.3, "If your power's useful, you get a gold badge."], [25.3, "You become a hero."], [26.0, "If it's not, you get a gray badge that says ordinary."], [28.6, "I was not worried about testing day."], [30.0, "Cuz there's one thing everybody knows about me."], [31.9, "I have never told a lie."], [33.3, "Not one."], [34.0, "Not ever."], [34.5, "In second grade, I told my teacher I cheated on a test."], [36.8, "I didn't."], [37.2, "I just looked at the clock."], [38.1, "When grandma asks if I like her meatloaf, I say no."], [40.3, "Every single time."], [41.4, "On my 13th birthday, I sat down in the guild's big glass chair, and the machine"], [45.0, "lit up."], [45.4, "The judge read my power out loud, and the whole room went silent."], [48.2, "Whatever this boy says, everyone believes."], [50.5, "The most honest kid in the world got the power of a liar."], [53.2, "\"I'm sorry, son.\" the judge said."], [54.6, "\"That power's too dangerous.\" He pinned a gray badge on my shirt, and then a red"], [57.7, "one under it."], [58.3, "Banned."], [58.9, "I wasn't allowed to use my power."], [60.2, "Ever."], [60.5, "And honestly, I didn't care."], [61.7, "I wasn't planning to lie anyway."], [63.0, "Until one morning, the ocean started to boil, and something stood up out of the water."], [66.6, "A giant made of storm clouds."], [68.3, "300 ft tall."], [69.6, "Lightning crackling in its fists."], [71.1, "And it started walking toward the city."], [72.5, "The hero guild flew out to stop it."], [74.1, "Thundergirl screamed at it."], [75.2, "It didn't even flinch."], [76.1, "The invincible guy ran at it, and then ran right back."], [78.5, "The giant swatted the flying heroes out of the sky like flies."], [81.4, "One step, a whole pier gone."], [83.1, "Two steps, the lighthouse."], [84.3, "And on the third step, it was going to be our street."], [86.4, "Everyone was running except me."], [87.8, "I looked down at my red badge."], [89.3, "Banned."], [89.9, "I ran up all 40 floors of the tallest building in the city."], [92.6, "I got to the roof just as the giant reached the edge of town."], [95.0, "Its head was right in front of me."], [96.3, "Big as a house."], [97.0, "Lightning in its eyes."], [98.0, "It leaned down."], [98.9, "I took a deep breath."], [99.7, "I had never told a lie."], [100.8, "Not once in my whole life."], [102.2, "I cupped my hands around my mouth, and I told my first one."], [104.6, "\"You're tiny.\" The giant froze."], [106.4, "It looked down at its hands, and it believed me."], [108.3, "It started shrinking."], [109.2, "100 ft, 10 ft."], [110.5, "By the time it hit the street, it was the size of a puppy."], [112.6, "A fluffy little storm cloud with tiny legs."], [114.8, "It sneezed, and a tiny lightning bolt popped out."], [117.1, "The whole city started cheering."], [118.7, "The judge ran up to me with a gold badge."], [120.6, "\"Son, the hero guild would be honored if\" \"I'm not a hero,\" I said, \"and everybody"], [124.6, "believed me.\" They all just walked away."], [126.1, "\"Wait, wait, I'm a hero."], [127.6, "I'm a hero.\" Now, I'm the only hero in the guild with three badges: gray, red,"], [131.9, "and gold."], [132.4, "And that storm giant lives in my backyard."], [134.4, "Every morning, I tell it one thing: \"You're a good boy.\" And it believes me."]], "beats": [{"t": 0, "k": "hook", "s": "At 13 your superpower is the opposite of who you are"}, {"t": 4, "k": "rule", "s": "Shy girl has thunder voice, bully heals; badges decide heroes"}, {"t": 29  return `<div class="stats">

 if(/^\(.*\)$/.test(l))return`<p class="note">${esc(l)}</p>`;
 return`<p>${esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>")}</p>`}).join("")}
