.goal{display:grid;grid-template-columns:auto 1fr auto;gap:8px 28px;align-items:center;padding:18px 24px;margin-bottom:16px}

.tabs>div{padding:18px 12px;text-align:center;border-left:1px solid var(--border)}
.tabs>div:first-child{border-left:0;background:linear-gradient(180deg,#3ea6ff1f,transparent 75%);position:relative}
.tabs>div:first-child::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent);box-shadow:0 0 14px #3ea6ffaa}
.lab{color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase}
.val{font-size:clamp(24px,2.6vw,36px);font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.sub{color:var(--muted);font-size:12.5px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 18px 0}
.seg{display:flex;border:1px solid var(--border);border-radius:999px;padding:2px;background:#ffffff05}
.seg button{background:transparent;border:0;border-radius:999px;color:var(--muted);font:inherit;font-size:12.5px;font-weight:500;padding:5px 12px;cursor:pointer}
.seg button:hover{color:var(--ink)}.seg button.on{background:#ffffff1a;color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chartwrap{position:relative;padding:18px 16px 6px}
svg{display:block;width:100%;height:auto;overflow:visible}
.tick{fill:var(--muted);font-size:12px}
.tip{position:absolute;pointer-events:none;background:#1d2026f2;backdrop-filter:blur(10px);border:1px solid #3a3f47;border-radius:14px;padding:10px 14px;display:none;box-shadow:0 12px 32px #000a;width:290px;z-index:2}

.tip .d{font-weight:600;font-size:13px}.tip .n{color:var(--accent);font-size:26px;font-weight:700;letter-spacing:-.02em}
.tip .s{color:var(--muted);font-size:12px}
.hint{color:var(--muted);font-size:12px;text-align:center;padding:2px 16px 14px;opacity:.8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:900px){.row{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}.tabs>div:nth-child(3){border-left:0}.tabs>div:nth-child(n+3){border-top:1px solid var(--border)}}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}

.tablewrap{overflow-x:auto}

feOM":5987975,"SVuDuptu1LQ":3819450,"CO1fdJCP9MI":1758998,"_yT-DSSzjKk":5035538,"ogWDhU3Pk_g":11529216,"Mooydy0PLys":4668412,"8qrlqt-oZ0E":10159440,"KfkhG_3F0jU":7495078,"Bv2WjggkbfY":4643860,"xqSA3lTZp3Y":6106951,"D0d0fI9EDlg":11021468,"snNhBgEjE3U":5001313,"4mYr2AcaE-4":6516171,"Dhxm9lWynAU":2698807,"scgaLrjL1QM":12019714,"uE9eGW5F9pY":5601047,"Oog0eC1itkk":6138712,"KJmj2QDkEy4":3889148,"s9xPTQECvAM":5932399,"WOC4yFm2zRA":5448530,"UTPxt6zuaL0":9856607,"CPj0d7ViJLg":4960779,"zbMdESuKNMA":26897038,"xYBVu_5Gnuw":3630235,"b7RJvOxXTD4":4712184,"vV1QX-4VOR4":5465502,"ij9GwTzVwPg":18185961,"trpmoV348CE":8489656,"TOVaYDrA0kM":5642439,"q4Bf214jcu0":16652948,"0tgycM-uL9U":6485218,"pFHlbrw_QUQ":12132223,"SD2e0bFkSFI":10365997,"rvEvhFYVW6k":12055757,"3fQdTXpMDWY":4869819,"9i6Zz1H8UrM":10773552}}}}],"built":1795334165};</script>
<script>
const T = window.TRACKER, C = T.config;
const $ = id => document.getElementById(id);
const fmt = n => n == null ? "–" : n >= 1e6 ? (n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,"")+"m" : n >= 1e3 ? (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"k" : Math.round(n)+"";
const full = n => n == null ? "–" : Math.round(n).toLocaleString("en-GB");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = t => t.replace(/\s*#\S+/g, "").trim();
const dfmt = (ts, o) => new Date(ts*1000).toLocaleDateString("en-GB", o || {day:"numeric", month:"short"});
const tfmt = ts => new Date(ts*1000).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const link = id => `https://youtube.com/shorts/${id}`;

const now = T.built, snaps = T.snapshots, last = snaps[snaps.length-1];
const since = new Date(C.story_since + "T00:00:00").getTime()/1000;
const vids = T.videos.filter(v => !v.gone).map(v => {
  const age = v.timestamp ? Math.max((now - v.timestamp)/86400, 0.5) : null;
  return {...v, age, perday: age ? v.views/age : null,
          likerate: v.likes && v.views ? v.likes/v.views*100 : null,
          story: !!v.timestamp && v.timestamp >= since};
});
const story = vids.filter(v => v.story);
const dated = vids.filter(v => v.timestamp);

// gains from snapshots: views at an earlier snapshot vs now
function snapAt(t) { let best = null; for (const s of snaps) if (s.t <= t) best = s; return best; }
function gain(set, ref) { if (!ref) return null; let g = 0; for (const v of set) { const a = ref.v[v.id]; if (a != null && v.views != null) g += v.views - a; } return g; }
const ref24 = snaps.length > 1 ? (snapAt(now - 86400) || snaps[0]) : null;

// header
const total = story.reduce((a, v) => a + v.views, 0);
$("kick").textContent = `${C.channel_name} tracker · updated ${dfmt(now, {day:"numeric", month:"short", year:"numeric"})}, ${tfmt(now)}`;
$("h1").innerHTML = `Our ${story.length} story Shorts got <b>${full(total)}</b> views`;

// goal bar
const g = C.goal, cur = g.kind === "subs" ? last.subs : total, pct = cur / g.target * 100;
$("goal").innerHTML = `<div class="lab">${esc(g.label)}</div><div class="big">${pct.toFixed(1)}%</div>
  <div class="r"><b>${fmt(cur)}</b> of ${fmt(g.target)}${g.kind==="subs"?" subscribers":" views"}</div>
  <div class="bar"><div style="width:${Math.min(pct,100)}%"></div></div>`;

// stat tabs
const days = Math.max(1, Math.ceil((now - since)/86400));
const upDays = new Set(story.map(v => dfmt(v.timestamp, {day:"numeric", month:"numeric"}))).size;
const avg = total / Math.max(story.length, 1);
const med = (a => a.length ? a[a.length>>1] : 0)(story.map(v => v.views).sort((a,b) => a-b));
const subs0 = snaps[0].subs, subsGain = last.subs - subs0;
$("tabs").innerHTML = [
  ["Views", fmt(total), `on story Shorts since ${dfmt(since)}`],
  ["Uploads", story.length, `${days - upDays} of ${days} days with no upload`],
  ["Average per Short", fmt(avg), `median ${fmt(med)} · best ${fmt(Math.max(...story.map(v => v.views)))}`],
  ["Subscribers", fmt(last.subs), snaps.length > 1 ? `${subsGain>=0?"+":""}${full(subsGain)} since ${dfmt(snaps[0].t)} (rounded by YouTube)` : "first read today · rounded by YouTube"],
].map(([l, v, s]) => `<div><div class="lab">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`).join("");

// bar chart
let SET = "story", MET = "views";
function drawChart() {
  const list = (SET === "story" ? story : dated).slice().sort((a,b) => a.timestamp - b.timestamp);
  const val = v => v[MET] ?? 0;
  const W = 1000, H = 300, L = 8, R = 52, TOP = 10, B = 34;
  const max = Math.max(...list.map(val), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max/step)*step;
  const ticks = [0, nice/2, nice];
  const bw = (W - L - R) / list.length, y = v => TOP + (H - TOP - B) * (1 - v/nice);
  const mean = list.reduce((a, v) => a + val(v), 0) / Math.max(list.length, 1);
  const unit = MET === "likerate" ? (n => n.toFixed(1)+"%") : fmt;
  let s = ticks.map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/>
    <text class="tick" x="${W-R+8}" y="${y(t)+4}">${unit(t)}</text>`).join("");
  let lastLab = -999;
  list.forEach((v, i) => {
    const x = L + i*bw, h = H - B - y(val(v));
    const col = v.story ? "var(--accent)" : "var(--other)";
    s += `<a href="${link(v.id)}" target="_blank"><rect data-i="${i}" x="${x+bw*0.14}" y="${y(val(v))}" width="${bw*0.72}" height="${Math.max(h,1)}" rx="${Math.min(5,bw*0.2)}" fill="${col}" opacity=".9"/></a>`;
    if (x - lastLab > 70) { s += `<text class="tick" x="${x+bw/2}" y="${H-12}" text-anchor="middle">${dfmt(v.timestamp)}</text>`; lastLab = x; }
  });
  s += `<line x1="${L}" x2="${W-R}" y1="${y(mean)}" y2="${y(mean)}" stroke="#ffffff88" stroke-dasharray="5 5"/>
        <text class="tick" x="${W-R+8}" y="${y(mean)+4}" fill="#fff">avg</text>`;
  const svg = $("chart"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = s;
  const tip = $("tip"), wrap = $("chartwrap");
  svg.querySelectorAll("rect").forEach(r => {
    r.addEventListener("mouseenter", () => {
      const v = list[+r.dataset.i];
      r.setAttribute("opacity", "1");
      tip.innerHTML = `<img src="${thumb(v.id)}" alt=""><div class="d">${esc(clean(v.title))}</div>
        <div class="s">${dfmt(v.timestamp, {weekday:"short", day:"numeric", month:"short"})}, ${tfmt(v.timestamp)} · ${Math.round(v.duration||0)} s${v.story?"":" · not a story Short"}</div>
        <div class="n">${MET==="likerate" ? unit(val(v)) : full(val(v))}</div>
        <div class="s">${full(v.views)} views · ${full(v.likes)} likes (${v.likerate?.toFixed(1)??"–"}%) · ${fmt(v.perday)}/day</div>`;
      tip.style.display = "block";
      const rb = r.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
      let left = rb.left - wb.left + rb.width/2 - 145;
      tip.style.left = Math.max(4, Math.min(left, wb.width - 294)) + "px";
      tip.style.top = Math.max(0, rb.top - wb.top - tip.offsetHeight - 10) + "px";
    });
    r.addEventListener("mouseleave", () => { r.setAttribute("opacity", ".9"); tip.style.display = "none"; });
  });
}
function seg(id, cb) { $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); cb(b.dataset.v); }); }
seg("setSeg", v => { SET = v; drawChart(); drawTable(); });
seg("metSeg", v => { MET = v; drawChart(); });
drawChart();

// gains card
(function () {
  const el = $("gains");
  if (snaps.length < 2) {
    el.innerHTML = `<h2>Views gained</h2><div class="empty">First read at ${tfmt(snaps[0].t)} on ${dfmt(snaps[0].t)}. Views gained per hour and per day show up after the next reads (the fetch runs once an hour).</div>`;
    return;
  }
  const g24 = gain(story, ref24), gAll = gain(vids, ref24);
  const prev = snaps[snaps.length-2], gLast = gain(story, prev), hrs = (last.t - prev.t)/3600;
  // story-total line over snapshots
  const pts = snaps.map(s => [s.t, story.reduce((a, v) => a + (s.v[v.id] ?? 0), 0)]);
  const t0 = pts[0][0], t1 = pts[pts.length-1][0], v0 = Math.min(...pts.map(p=>p[1])), v1 = Math.max(...pts.map(p=>p[1]));
  const W = 600, H = 140, X = t => (t - t0)/Math.max(t1 - t0, 1)*W, Y = v => H - 8 - (v - v0)/Math.max(v1 - v0, 1)*(H - 16);
  const d = pts.map((p, i) => `${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const per = story.map(v => ({v, g: ref24.v[v.id] != null ? v.views - ref24.v[v.id] : null})).filter(x => x.g).sort((a,b) => b.g - a.g).slice(0, 5);
  el.innerHTML = `<h2>Views gained · story Shorts</h2>
    <div class="kpis">
      <div><div class="k">Since ${tfmt(ref24.t)} ${dfmt(ref24.t)}</div><div class="v">+${fmt(g24)}</div></div>
      <div><div class="k">Last read (${hrs.toFixed(1)} h)</div><div class="v">+${fmt(gLast)}</div></div>
      <div><div class="k">All Shorts (45 days)</div><div class="v">+${fmt(gAll)}</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:140px"><path d="${d} L${W},${H} L0,${H}Z" fill="#3ea6ff1c"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
    <div class="sub" style="display:flex;justify-content:space-between;margin:4px 0 12px"><span>${dfmt(t0)} ${tfmt(t0)}</span><span>total story views</span><span>${dfmt(t1)} ${tfmt(t1)}</span></div>
    <div class="list">${per.map((x, i) => `<a href="${link(x.v.id)}" target="_blank"><span class="rk">${i+1}</span><img src="${thumb(x.v.id)}" alt=""><div class="t"><div>${esc(clean(x.v.title))}</div><div class="vd">${dfmt(x.v.timestamp)}</div></div><div class="n up">+${fmt(x.g)}<small>${fmt(x.v.views)} total</small></div></a>`).join("")}</div>`;
})();

// fastest Shorts
$("top").innerHTML = story.slice().sort((a,b) => b.perday - a.perday).slice(0, 6).map((v, i) =>
  `<a href="${link(v.id)}" target="_blank"><span class="rk">${i+1}</span><img src="${thumb(v.id)}" alt="">
   <div class="t"><div>${esc(clean(v.title))}</div><div class="vd">${dfmt(v.timestamp)} · ${full(v.views)} views · ${v.likerate?.toFixed(1)??"–"}% likes</div></div>
   <div class="n">${fmt(v.perday)}<small>per day</small></div></a>`).join("");

// table
let SORT = "timestamp", DIR = -1;
const COLS = [["title","Short"],["timestamp","Uploaded"],["duration","Length"],["views","Views"],["likes","Likes"],["likerate","Like %"],["perday","Views/day"],["g24","Gain"]];
function drawTable() {
  const list = (SET === "story" ? story : dated).map(v => ({...v, g24: ref24 && ref24.v[v.id] != null ? v.views - ref24.v[v.id] : null}));
  list.sort((a, b) => { const x = a[SORT], y = b[SORT]; return (x == null) - (y == null) || (typeof x === "string" ? x.localeCompare(y) : x - y) * DIR; });
  $("tbl").innerHTML = `<tr>${COLS.map(([k, l]) => `<th data-k="${k}" class="${k===SORT?"on":""}">${l}${k===SORT?(DIR<0?" ↓":" ↑"):""}</th>`).join("")}</tr>` +
    list.map(v => `<tr><td><a class="vt" href="${link(v.id)}" target="_blank"><img src="${thumb(v.id)}" alt="" loading="lazy"><span>${esc(clean(v.title))}</span></a></td>
      <td>${dfmt(v.timestamp)}</td><td>${v.duration ? Math.round(v.duration)+" s" : "–"}</td><td>${full(v.views)}</td><td>${full(v.likes)}</td>
      <td>${v.likerate?.toFixed(1) ?? "–"}</td><td>${fmt(v.perday)}</td><td class="${v.g24>0?"up":""}">${v.g24 == null ? "–" : "+"+full(v.g24)}</td></tr>`).join("");
  $("tbl").querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; DIR = k === SORT ? -DIR : -1; SORT = k; drawTable(); });
}
drawTable();

// ---------- competition ----------
(function () {
  const comps = T.competitors || [];
  if (!comps.length) { document.querySelector("#ctbl").closest(".panel").style.display = "none"; $("ctop").closest(".card").style.display = "none"; return; }
  const CD = C.competitor_days || 30, cut = now - CD*86400;
  $("cdays").textContent = CD;
  const COL = ["#f4a340", "#a78bfa", "#f0637a", "#3ccf6a", "#f5d547", "#4fd1c5"];
  const chans = [{name: C.channel_name + " (story)", me: true, color: "#3ea6ff", subs: last.subs, url: C.channel_url,
                  videos: story.filter(v => v.timestamp >= cut)}]
    .concat(comps.map((c, i) => ({...c, color: COL[i % COL.length], videos: c.videos.filter(v => v.timestamp >= cut)})));
  for (const ch of chans) ch.videos = ch.videos.map(v => ({...v, ch, perday: v.views / Math.max((now - v.timestamp)/86400, 0.5)}));
  // views gained in ~24 h from competitor snapshots
  const cs = T.comp_snapshots || [];
  const cref = cs.length > 1 ? (cs.filter(s => s.t <= now - 86400).pop() || cs[0]) : null;
  const cgain = ch => { if (ch.me) return ref24 ? gain(story, ref24) : null;
    const r = cref && cref.c[ch.name]; if (!r) return null; let g = 0;
    for (const v of ch.videos) if (r.v[v.id] != null) g += v.views - r.v[v.id]; return g; };
  const median = a => { a = a.slice().sort((x, y) => x - y); return a.length ? a[a.length >> 1] : 0; };
  const rows = chans.map(ch => { const vs = ch.videos.map(v => v.views), sum = vs.reduce((a, b) => a + b, 0);
    const best = ch.videos.slice().sort((a, b) => b.views - a.views)[0];
    return {ch, n: vs.length, perweek: vs.length / CD * 7, sum, avg: sum / Math.max(vs.length, 1), med: median(vs), best, g: cgain(ch),
      like: ch.videos.reduce((a, v) => a + (v.likes || 0), 0) / Math.max(sum, 1) * 100}; });
  const refTime = cref ? cref.t : ref24 && ref24.t;
  $("ctbl").innerHTML = `<tr><th>Channel</th><th>Subscribers</th><th>Shorts</th><th>Per week</th><th>Views (${CD} d)</th><th>Avg / Short</th><th>Median</th><th>Like %</th><th>Gained${refTime ? " since " + tfmt(refTime) : ""}</th><th style="text-align:left">Best Short</th></tr>` +
    rows.sort((a, b) => b.avg - a.avg).map(r => `<tr class="${r.ch.me ? "me" : ""}"><td><a href="${r.ch.url}" target="_blank"><span class="dot" style="background:${r.ch.color}"></span><b>${esc(r.ch.name)}</b></a></td>
      <td>${fmt(r.ch.subs)}</td><td>${r.n}</td><td>${r.perweek.toFixed(1)}</td><td>${fmt(r.sum)}</td><td><b>${fmt(r.avg)}</b></td><td>${fmt(r.med)}</td><td>${r.like.toFixed(1)}</td>
      <td class="${r.g > 0 ? "up" : ""}">${r.g == null ? "–" : "+" + fmt(r.g)}</td>
      <td style="text-align:left;max-width:260px;overflow:hidden;text-overflow:ellipsis">${r.best ? `<a href="${link(r.best.id)}" target="_blank">${esc(clean(r.best.title))}</a> <span class="sub">${fmt(r.best.views)}</span>` : "–"}</td></tr>`).join("");
  if (!cref) $("ctbl").insertAdjacentHTML("afterend", `<div class="sub" style="margin-top:8px">“Gained” fills in once there are two reads a few hours apart.</div>`);

  // bar chart: one bar per channel, sorted, number on each bar
  const MET = {
    med:     {lab: "Typical views per Short", hint: `Median views per Short uploaded in the last ${CD} days. Median = the middle Short, so one viral hit doesn't skew it.`, f: fmt},
    perweek: {lab: "Shorts per week", hint: `How many Shorts each channel posted per week, last ${CD} days.`, f: n => n.toFixed(1)},
    sum:     {lab: "Total views", hint: `All views on Shorts uploaded in the last ${CD} days.`, f: fmt},
    subs:    {lab: "Subscribers", hint: "Subscribers today (rounded by YouTube).", f: fmt},
    like:    {lab: "Like %", hint: `Likes ÷ views on Shorts from the last ${CD} days. Shows how much viewers liked them, whatever the size of the channel.`, f: n => n.toFixed(1) + "%"},
  };
  const val = (r, k) => k === "subs" ? r.ch.subs || 0 : r[k];
  function bars(k) {
    const m = MET[k], list = rows.slice().sort((a, b) => val(b, k) - val(a, k));
    const max = Math.max(...list.map(r => val(r, k)), 1), me = rows.find(r => r.ch.me), mine = val(me, k);
    $("cbars").innerHTML = list.map(r => {
      const v = val(r, k), w = v / max * 100, ratio = !r.ch.me && mine > 0 ? v / mine : null;
      const cmp = r.ch.me ? `<span class="sub">us</span>` : ratio == null ? "" :
        `<span class="sub">${ratio >= 1.05 ? (ratio >= 10 ? Math.round(ratio) : ratio.toFixed(1)) + "× ours" : ratio <= 0.95 ? (1/ratio).toFixed(1) + "× less than ours" : "same as ours"}</span>`;
      return `<div style="display:grid;grid-template-columns:150px 1fr 150px;gap:12px;align-items:center;margin:10px 0">
        <a href="${r.ch.url}" target="_blank" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:${r.ch.me ? 700 : 500}"><span class="dot" style="background:${r.ch.color}"></span>${esc(r.ch.name)}</a>
        <div style="height:28px;background:#ffffff08;border-radius:8px;overflow:hidden"><div style="height:100%;width:${Math.max(w, 0.6)}%;background:${r.ch.color};border-radius:8px;${r.ch.me ? "box-shadow:0 0 14px #3ea6ff99" : "opacity:.85"}"></div></div>
        <div style="text-align:right"><b style="font-size:17px">${m.f(v)}</b><br>${cmp}</div></div>`;
    }).join("");
    $("chint").textContent = m.hint;
  }
  seg("cmetSeg", bars);
  bars("med");

  // ---------- daily line chart ----------
  const DAY = 86400, dayKey = t => { const d = new Date(t*1000); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
  const dayStart = t => { const d = new Date(t*1000); d.setHours(0,0,0,0); return d.getTime()/1000; };
  // views gained per day: diff between the first reads of consecutive days
  function gainedByDay(ch) {
    const list = ch.me ? snaps.map(s => ({t: s.t, v: s.v})) : cs.filter(s => s.c[ch.name]).map(s => ({t: s.t, v: s.c[ch.name].v}));
    const first = {}; for (const s of list) { const k = dayKey(s.t); if (!first[k]) first[k] = s; }
    const out = {}, keys = Object.keys(first);
    for (let i = 0; i + 1 < keys.length; i++) { const a = first[keys[i]], b = first[keys[i+1]]; let g = 0;
      for (const id in b.v) if (a.v[id] != null) g += b.v[id] - a.v[id];
      out[keys[i]] = g * DAY / Math.max(b.t - a.t, 1); }  // scaled to a full day
    return out;
  }
  const lon = new Set(chans.map(c => c.name)); let LMODE = "upl", LR = 30;
  const chipHtml = () => `<button class="chip ${lon.size === chans.length ? "on" : ""}" data-n="*">All channels</button>` +
    chans.map(c => `<button class="chip ${lon.has(c.name) && lon.size < chans.length ? "on" : ""}" data-n="${esc(c.name)}"><i style="background:${c.color}"></i>${esc(c.name)}</button>`).join("");
  $("lchips").onclick = e => { const b = e.target.closest("button"); if (!b) return; const n = b.dataset.n;
    if (n === "*") chans.forEach(c => lon.add(c.name));
    else if (lon.size === chans.length) { lon.clear(); lon.add(n); }
    else { lon.has(n) ? lon.delete(n) : lon.add(n); if (!lon.size) chans.forEach(c => lon.add(c.name)); }
    line(); };
  seg("lmode", v => { LMODE = v; line(); });
  seg("lrange", v => { LR = +v; line(); });
  function line() {
    $("lchips").innerHTML = chipHtml();
    const sel = chans.filter(c => lon.has(c.name));
    const today = dayStart(now), days = []; for (let i = LR - 1; i >= 0; i--) days.push(today - i*DAY);
    const series = sel.map(c => {
      let vals;
      if (LMODE === "upl") { const m = {}; for (const v of c.videos) { const k = dayKey(v.timestamp); m[k] = (m[k] || 0) + v.views; }
        vals = days.map(d => m[dayKey(d)] ?? 0); }
      else { const g = gainedByDay(c); vals = days.map(d => g[dayKey(d)] ?? null); }
      return {c, vals};
    });
    const ups = days.map(d => sel.flatMap(c => c.videos.filter(v => dayKey(v.timestamp) === dayKey(d))));
    const W = 1000, H = 360, L = 12, R = 60, TOP = 12, PLOT = 280, UPY = 300, B = 340;
    const max = Math.max(...series.flatMap(s => s.vals.filter(v => v != null)), 1);
    const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max/step)*step;
    const x = i => L + (i + 0.5) * (W - L - R) / days.length, y = v => TOP + (PLOT - TOP) * (1 - v/nice);
    let s = [0, nice/3, nice*2/3, nice].map(t => `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text class="tick" x="${W-R+10}" y="${y(t)+4}">${fmt(t)}</text>`).join("");
    if (LMODE === "upl") s += `<rect x="${x(days.length-1)-(W-L-R)/days.length/2}" y="${TOP}" width="${(W-L-R)/days.length}" height="${PLOT-TOP}" fill="#ffffff06"/>`;
    const lab = LR <= 7 ? 1 : 4;
    days.forEach((d, i) => { if ((days.length - 1 - i) % lab === 0) s += `<text class="tick" x="${x(i)}" y="${B+12}" text-anchor="middle">${dfmt(d)}</text>`; });
    s += `<line x1="${L}" x2="${W-R}" y1="${UPY+22}" y2="${UPY+22}" stroke="var(--grid)"/>`;
    ups.forEach((u, i) => { if (!u.length) return;
      const col = new Set(u.map(v => v.ch.color)).size === 1 ? u[0].ch.color : "#9299a3";
      s += `<rect class="upbox" x="${x(i)-10}" y="${UPY-6}" width="20" height="20" rx="5" style="stroke:${col}"/><text class="uptx" x="${x(i)}" y="${UPY+8}" text-anchor="middle">${u.length}</text>`; });
    let any = false;
    for (const {c, vals} of series) {
      const pts = vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean); if (!pts.length) continue; any = true;
      s += `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("")}" fill="none" stroke="${c.color}" stroke-width="${c.me ? 3 : 2.2}" stroke-linejoin="round"/>`;
      s += pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c.color}"/>`).join("");
    }
    if (!any) s += `<text x="${(W-R)/2}" y="${PLOT/2}" text-anchor="middle" class="tick" style="font-size:15px">Not enough reads yet: this fills in after a full day of hourly reads (first read ${dfmt(snaps[0].t)} ${tfmt(snaps[0].t)}).</text>`;
    s += `<line id="lcur" x1="0" x2="0" y1="${TOP}" y2="${UPY+22}" stroke="#ffffff55" style="display:none"/>`;
    days.forEach((d, i) => s += `<rect data-i="${i}" x="${x(i)-(W-L-R)/days.length/2}" y="0" width="${(W-L-R)/days.length}" height="${B}" fill="transparent" style="cursor:pointer"/>`);
    const svg = $("lchart"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = s;
    const tip = $("ltip"), wrap = $("lwrap"), cur = svg.querySelector("#lcur");
    svg.querySelectorAll("rect[data-i]").forEach(r => {
      r.onmouseenter = () => { const i = +r.dataset.i, u = ups[i];
        cur.setAttribute("x1", x(i)); cur.setAttribute("x2", x(i)); cur.style.display = "";
        const rowsH = series.slice().sort((a, b) => (b.vals[i] ?? -1) - (a.vals[i] ?? -1)).map(({c, vals}) =>
          `<div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:3px"><span><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span><b>${vals[i] == null ? "–" : full(vals[i])}</b></div>`).join("");
        tip.innerHTML = `<div class="d">${dfmt(days[i], {weekday:"short", day:"numeric", month:"short", year:"numeric"})}</div>
          <div class="s" style="margin-bottom:4px">${LMODE === "upl" ? "Views of Shorts uploaded this day" : "Views gained this day"}</div>${rowsH}
          <div class="s" style="margin-top:8px">${u.length} upload${u.length === 1 ? "" : "s"}${u.length ? ": " + u.slice(0, 6).map(v => esc(v.ch.name)).join(", ") + (u.length > 6 ? "…" : "") : ""}</div>`;
        tip.style.display = "block";
        const rb = r.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
        const left = rb.left - wb.left + rb.width/2 + 16;
        tip.style.left = (left + 294 > wb.width ? left - 326 : left) + "px"; tip.style.top = "20px"; };
      r.onmouseleave = () => { tip.style.display = "none"; cur.style.display = "none"; };
    });
    $("lhint").textContent = LMODE === "upl"
      ? "Each point = total views (so far) of the Shorts a channel uploaded that day. Boxes under the chart = number of uploads. Click a channel to show only it."
      : "Each point = views a channel's recent Shorts gained that day, from the hourly reads. Fills in as reads pile up.";
  }
  line();

  // ---------- realtime side panel ----------
  (function () {
    const lastC = cs[cs.length-1], prevC = cs.length > 1 ? cs[cs.length-2] : null;
    const lastRead = Math.max(last.t, lastC ? lastC.t : 0), mins = Math.round((Date.now()/1000 - lastRead)/60);
    const per = chans.map(c => { let g = null;
      if (c.me) { const p = snaps.length > 1 ? snaps[snaps.length-2] : null; if (p) g = gain(story, p); }
      else if (prevC && prevC.c[c.name] && lastC.c[c.name]) { g = 0; const a = prevC.c[c.name].v, b = lastC.c[c.name].v; for (const id in b) if (a[id] != null) g += b[id] - a[id]; }
      return {c, g}; });
    const hrs = prevC ? (lastC.t - prevC.t)/3600 : null;
    const top = chans.flatMap(c => c.videos).filter(v => v.timestamp >= now - 2*DAY).sort((a, b) => b.perday - a.perday).slice(0, 6);
    $("side").innerHTML = `<h3>Realtime</h3><div class="live"><i></i>Updating hourly · read ${mins < 60 ? mins + " min" : Math.round(mins/60) + " h"} ago</div>
      <section><div class="sub">Views gained since the read before${hrs ? ` (${hrs < 1 ? Math.round(hrs*60) + " min" : hrs.toFixed(1) + " h"})` : ""}</div>
        ${per.every(p => p.g == null) ? `<div class="empty">Shows after the next hourly read.</div>` :
          per.slice().sort((a, b) => (b.g ?? -1) - (a.g ?? -1)).map(p => `<div class="kv"><span><span class="dot" style="background:${p.c.color}"></span>${esc(p.c.name)}</span><span class="${p.g > 0 ? "up" : ""}">${p.g == null ? "–" : "+" + full(p.g)}</span></div>`).join("")}
      </section>
      <section><div class="sub" style="margin-bottom:4px">Subscribers</div>
        ${chans.slice().sort((a, b) => b.subs - a.subs).map(c => `<div class="kv"><span><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span><span>${fmt(c.subs)}</span></div>`).join("")}
      </section>
      <section><div class="sub" style="margin-bottom:6px">Hottest Shorts · last 48 h</div><div class="list">${top.map((v, i) =>
        `<a href="${link(v.id)}" target="_blank"><span class="rk">${i+1}</span><img src="${thumb(v.id)}" alt=""><div class="t"><div>${esc(clean(v.title))}</div><div class="vd"><span class="dot" style="background:${v.ch.color}"></span>${esc(v.ch.name)}</div></div><div class="n">${fmt(v.views)}<small>${fmt(v.perday)}/day</small></div></a>`).join("")}</div></section>`;
  })();

  // competitors' best this week
  $("ctop").innerHTML = chans.filter(c => !c.me).flatMap(c => c.videos).filter(v => v.timestamp >= now - 7*86400)
    .sort((a, b) => b.perday - a.perday).slice(0, 10).map((v, i) =>
    `<a href="${link(v.id)}" target="_blank"><span class="rk">${i+1}</span><img src="${thumb(v.id)}" alt="">
     <div class="t"><div>${esc(clean(v.title))}</div><div class="vd"><span class="dot" style="background:${v.ch.color}"></span>${esc(v.ch.name)} · ${dfmt(v.timestamp)} · ${full(v.views)} views</div></div>
     <div class="n">${fmt(v.perday)}<small>per day</small></div></a>`).join("");
})();

$("foot").innerHTML = `${C.channel_name} (<a href="${C.channel_url}" target="_blank">${C.channel_url.split("/").pop()}</a>) · public counts read with yt-dlp, no login.
  Exact views and likes for Shorts from the last ${C.full_read_days} days (competitors: ${C.competitor_days||30} days); subscribers are rounded by YouTube.<br>
  ${snaps.length} read${snaps.length>1?"s":""} so far, first ${dfmt(snaps[0].t)} ${tfmt(snaps[0].t)}, last ${dfmt(last.t)} ${tfmt(last.t)}. Story Shorts = uploads since ${dfmt(since, {day:"numeric", month:"long"})}.`;
</script>
</body>
</html>
